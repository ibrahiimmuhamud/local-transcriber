[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-batch-transcriber"
version = "0.1.0"
description = "Resumable local transcription and English translation with Whisper"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Ibrahiim Muhamud"}]
dependencies = ["faster-whisper>=1.2.1,<2", "av>=16.1,<17", "yt-dlp>=2025.1.15"]

[project.urls]
Repository = "https://github.com/ibrahiimmuhamud/local-transcriber"
Issues = "https://github.com/ibrahiimmuhamud/local-transcriber/issues"

[project.scripts]
local-transcriber = "local_transcriber.__main__:main"

[tool.setuptools.package-data]
local_transcriber = ["assets/*"]
